<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <linearGradient id="gClient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gApp" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gData" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">ARSITEKTUR SISTEM — SPK Draft Pick MLBB</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#475569">3-Tier: Client (Browser) — Application (Flask) — Data (Postgres + Cloudinary)</text>

  <!-- CLIENT LAYER -->
  <rect x="60" y="100" width="1080" height="140" rx="10" fill="url(#gClient)" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="130" font-size="16" font-weight="700" fill="#1e3a8a">CLIENT LAYER — Browser</text>
  <g font-size="13" fill="#1e293b">
    <rect x="90" y="150" width="220" height="70" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="200" y="176" text-anchor="middle" font-weight="600">draft.html</text>
    <text x="200" y="196" text-anchor="middle" font-size="11">User pilih hero (ban/pick)</text>
    <text x="200" y="212" text-anchor="middle" font-size="11">Vanilla JS + Jinja2</text>

    <rect x="330" y="150" width="220" height="70" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="440" y="176" text-anchor="middle" font-weight="600">admin.html</text>
    <text x="440" y="196" text-anchor="middle" font-size="11">CRUD hero + isi matriks AHP</text>
    <text x="440" y="212" text-anchor="middle" font-size="11">Perlu login (JWT)</text>

    <rect x="570" y="150" width="220" height="70" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="680" y="176" text-anchor="middle" font-weight="600">ahp.html</text>
    <text x="680" y="196" text-anchor="middle" font-size="11">Lihat matriks + bobot + CR</text>

    <rect x="810" y="150" width="220" height="70" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="920" y="176" text-anchor="middle" font-weight="600">heroes.html</text>
    <text x="920" y="196" text-anchor="middle" font-size="11">Tabel skor 6 kriteria</text>
  </g>

  <!-- ARROW client -> app -->
  <line x1="600" y1="240" x2="600" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="270" font-size="12" fill="#334155">HTTP + JSON</text>

  <!-- APP LAYER -->
  <rect x="60" y="290" width="1080" height="280" rx="10" fill="url(#gApp)" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="320" font-size="16" font-weight="700" fill="#78350f">APPLICATION LAYER — Flask (app.py)</text>

  <!-- Auth -->
  <rect x="90" y="340" width="220" height="90" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="200" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">AUTH</text>
  <text x="200" y="385" text-anchor="middle" font-size="12">JWT (HS256, TTL 12h)</text>
  <text x="200" y="401" text-anchor="middle" font-size="12">bcrypt password hash</text>
  <text x="200" y="417" text-anchor="middle" font-size="12">HttpOnly cookie</text>

  <!-- AHP -->
  <rect x="330" y="340" width="220" height="90" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="440" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">AHP ENGINE</text>
  <text x="440" y="385" text-anchor="middle" font-size="12">calc_ahp() — Saaty method</text>
  <text x="440" y="401" text-anchor="middle" font-size="12">geo_mean() — agregasi 3 penilai</text>
  <text x="440" y="417" text-anchor="middle" font-size="12">ahpy — cross-validator</text>

  <!-- SAW -->
  <rect x="570" y="340" width="220" height="90" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="680" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">SAW ENGINE</text>
  <text x="680" y="385" text-anchor="middle" font-size="12">calc_saw() — normalisasi</text>
  <text x="680" y="401" text-anchor="middle" font-size="12">benefit / cost handling</text>
  <text x="680" y="417" text-anchor="middle" font-size="12">skenario: default/safe/aggressive</text>

  <!-- Routes -->
  <rect x="810" y="340" width="300" height="90" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="960" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ROUTES</text>
  <text x="960" y="385" text-anchor="middle" font-size="12">/  /login  /admin  /ahp  /heroes</text>
  <text x="960" y="401" text-anchor="middle" font-size="12">/api/recommend  (endpoint utama)</text>
  <text x="960" y="417" text-anchor="middle" font-size="12">/admin/update_ahp  /admin/*_hero</text>

  <!-- In-memory cache -->
  <rect x="90" y="450" width="1020" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="6 4"/>
  <text x="600" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">IN-MEMORY CACHE (dibaca sekali saat startup)</text>
  <g font-size="12" fill="#1e293b">
    <text x="200" y="510" text-anchor="middle" font-weight="600">HEROES</text>
    <text x="200" y="526" text-anchor="middle">list of dict hero</text>
    <text x="400" y="510" text-anchor="middle" font-weight="600">SCORES</text>
    <text x="400" y="526" text-anchor="middle">{hero_id: {criterion: value}}</text>
    <text x="620" y="510" text-anchor="middle" font-weight="600">AHP_MATS</text>
    <text x="620" y="526" text-anchor="middle">{role: [m1, m2, m3]}</text>
    <text x="880" y="510" text-anchor="middle" font-weight="600">AHP_RESULTS</text>
    <text x="880" y="526" text-anchor="middle">{role: {weights, cr, ...}}</text>
  </g>

  <!-- ARROWS app -> data -->
  <line x1="400" y1="570" x2="300" y2="620" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="290" y="605" font-size="12" fill="#334155">SQLAlchemy ORM</text>

  <line x1="800" y1="570" x2="900" y2="620" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="820" y="605" font-size="12" fill="#334155">Cloudinary API</text>

  <!-- DATA LAYER -->
  <rect x="60" y="620" width="1080" height="170" rx="10" fill="url(#gData)" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="650" font-size="16" font-weight="700" fill="#14532d">DATA LAYER</text>

  <!-- Neon Postgres box -->
  <rect x="90" y="670" width="520" height="105" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="350" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Neon Postgres (db.py)</text>
  <g font-size="12" fill="#1e293b">
    <text x="130" y="720">• heroes</text>
    <text x="130" y="738">• hero_scores</text>
    <text x="130" y="756">• ahp_matrices</text>
    <text x="330" y="720">• users (admin)</text>
    <text x="330" y="738">• auto-fallback pooler → non-pooler</text>
    <text x="330" y="756">• pool_pre_ping, TCP keepalive</text>
  </g>

  <!-- Cloudinary box -->
  <rect x="640" y="670" width="470" height="105" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="875" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Cloudinary (cloud.py)</text>
  <g font-size="12" fill="#1e293b">
    <text x="680" y="720">• Storage portrait hero (400×400 crop face)</text>
    <text x="680" y="738">• public_id = hero_id → re-upload overwrite</text>
    <text x="680" y="756">• Fallback: DiceBear + inisial kalau nonaktif</text>
  </g>
</svg>
