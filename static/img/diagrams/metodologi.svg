<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="1200" fill="#f8fafc"/>

  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">METODOLOGI PENELITIAN — AHP + SAW</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#475569">AHP → menentukan bobot 6 kriteria    |    SAW → meranking hero berdasarkan bobot itu</text>

  <!-- =============== AHP =============== -->
  <rect x="40" y="90" width="1120" height="620" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="600" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">TAHAP 1 — AHP (Analytical Hierarchy Process)</text>

  <!-- Step A: Input 3 matriks -->
  <rect x="80" y="140" width="1040" height="80" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">A. INPUT — Matriks Perbandingan Berpasangan 6×6 (Skala Saaty 1–9)</text>
  <text x="600" y="187" text-anchor="middle" font-size="12">3 penilai per role: Coach, Player 1, Player 2  |  Kriteria: Difficulty, Crowd Control, Mobility, Utility, Durability, Offense</text>
  <text x="600" y="205" text-anchor="middle" font-size="11" fill="#475569">Contoh sel: aᵢⱼ = 3 → kriteria i "sedikit lebih penting" dari j    |    aⱼᵢ = 1/3 (resiprokal)</text>

  <line x1="600" y1="220" x2="600" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Step B: geometric mean -->
  <rect x="80" y="250" width="1040" height="80" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">B. AGREGASI 3 PENILAI  →  geo_mean()</text>
  <text x="600" y="298" text-anchor="middle" font-size="13" font-family="Consolas, monospace">a_agg[i][j] = ( a₁[i][j] × a₂[i][j] × a₃[i][j] ) ^ (1/3)</text>
  <text x="600" y="316" text-anchor="middle" font-size="11" fill="#475569">Geometric mean menjaga sifat resiprokal Saaty (Aczél &amp; Saaty 1983)</text>

  <line x1="600" y1="330" x2="600" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Step C: normalisasi + weights -->
  <rect x="80" y="360" width="500" height="150" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">C. NORMALISASI + BOBOT</text>
  <text x="330" y="410" text-anchor="middle" font-size="12" font-family="Consolas, monospace">Sⱼ = Σᵢ aᵢⱼ   (jumlah kolom)</text>
  <text x="330" y="432" text-anchor="middle" font-size="12" font-family="Consolas, monospace">nᵢⱼ = aᵢⱼ / Sⱼ   (normalisasi)</text>
  <text x="330" y="454" text-anchor="middle" font-size="12" font-family="Consolas, monospace">wᵢ = (1/n) Σⱼ nᵢⱼ   (bobot prioritas)</text>
  <text x="330" y="483" text-anchor="middle" font-size="11" fill="#475569">Output: vektor [w₁, w₂, w₃, w₄, w₅, w₆] jumlah = 1</text>

  <!-- Step D: lambda + CR -->
  <rect x="620" y="360" width="500" height="150" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="870" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">D. CONSISTENCY RATIO</text>
  <text x="870" y="410" text-anchor="middle" font-size="12" font-family="Consolas, monospace">λᵢ = (A · w)ᵢ / wᵢ    λmax = mean(λᵢ)</text>
  <text x="870" y="432" text-anchor="middle" font-size="12" font-family="Consolas, monospace">CI = (λmax − n) / (n − 1)</text>
  <text x="870" y="454" text-anchor="middle" font-size="12" font-family="Consolas, monospace">CR = CI / RI    (RI=1.24 untuk n=6)</text>
  <text x="870" y="483" text-anchor="middle" font-size="11" fill="#475569">Ambang: CR ≤ 0.10 → matriks konsisten</text>

  <line x1="330" y1="510" x2="330" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="870" y1="510" x2="870" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Step E: keputusan -->
  <polygon points="600,545 780,610 600,675 420,610" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">CR ≤ 0.10?</text>
  <text x="600" y="625" text-anchor="middle" font-size="11" fill="#78350f">konsisten</text>

  <text x="405" y="620" text-anchor="end" font-size="12" fill="#dc2626" font-weight="600">TIDAK</text>
  <text x="795" y="620" text-anchor="start" font-size="12" fill="#16a34a" font-weight="600">YA</text>

  <path d="M420 610 Q 250 610 250 300 Q 250 220 340 220" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="180" y="450" font-size="11" fill="#dc2626">revisi matriks</text>

  <line x1="780" y1="610" x2="870" y2="675" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Cross-check -->
  <rect x="700" y="675" width="340" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="870" y="695" text-anchor="middle" font-size="11" fill="#075985">Cross-validation: pustaka ahpy (Geometric Mean Method)</text>

  <!-- =============== SAW =============== -->
  <line x1="600" y1="710" x2="600" y2="750" stroke="#334155" stroke-width="3" marker-end="url(#arr3)"/>
  <text x="620" y="735" font-size="12" fill="#334155">bobot wᵢ diteruskan ke SAW</text>

  <rect x="40" y="750" width="1120" height="410" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="3"/>
  <text x="600" y="780" text-anchor="middle" font-size="20" font-weight="700" fill="#831843">TAHAP 2 — SAW (Simple Additive Weighting)</text>

  <!-- SAW A -->
  <rect x="80" y="800" width="1040" height="70" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="600" y="826" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">A. INPUT DATA</text>
  <text x="600" y="847" text-anchor="middle" font-size="12">Matriks skor hero × 6 kriteria (skala 0–5), bobot wᵢ dari AHP, daftar exclude, skenario (default/safe/aggressive)</text>

  <line x1="600" y1="870" x2="600" y2="895" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- SAW B: adjust weight by scenario -->
  <rect x="80" y="895" width="1040" height="70" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="600" y="920" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">B. ADJUSTMENT SKENARIO (opsional)</text>
  <text x="600" y="941" text-anchor="middle" font-size="12">safe: Durability×1.5, Utility×1.5, Offense×0.7, Mobility×0.8    |    aggressive: kebalikan. Lalu renormalisasi Σw=1</text>

  <line x1="600" y1="965" x2="600" y2="990" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- SAW C: normalize -->
  <rect x="80" y="990" width="500" height="90" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="330" y="1015" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">C. NORMALISASI</text>
  <text x="330" y="1038" text-anchor="middle" font-size="12" font-family="Consolas, monospace">benefit: rᵢⱼ = xᵢⱼ / max(xⱼ)</text>
  <text x="330" y="1058" text-anchor="middle" font-size="12" font-family="Consolas, monospace">cost:    rᵢⱼ = min(xⱼ) / xᵢⱼ</text>
  <text x="330" y="1074" text-anchor="middle" font-size="10" fill="#475569">Difficulty = cost, sisanya benefit</text>

  <!-- SAW D: Vi -->
  <rect x="620" y="990" width="500" height="90" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="870" y="1015" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">D. HITUNG NILAI PREFERENSI Vᵢ</text>
  <text x="870" y="1043" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="600">Vᵢ = Σⱼ (wⱼ × rᵢⱼ)</text>
  <text x="870" y="1066" text-anchor="middle" font-size="11" fill="#475569">Skor gabungan tiap hero</text>

  <line x1="330" y1="1080" x2="330" y2="1105" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="870" y1="1080" x2="870" y2="1105" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- SAW E: ranking -->
  <rect x="200" y="1105" width="800" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="1128" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">E. RANKING descending Vᵢ  →  Top 7 per role  →  Vi% = Vᵢ/Vmax × 100</text>
  <text x="600" y="1148" text-anchor="middle" font-size="11" fill="#14532d">Output final: rekomendasi hero terurut yang ditampilkan ke user</text>
</svg>
